services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data   # kept across `docker compose down` (only `down -v` wipes it)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission;Username=admission;Password=admission"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      API_URL: "${API_URL:-http://localhost:8080}"
    depends_on:
      - backend

volumes:
  pgdata:
