services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data   # kept across `docker compose down` (only `down -v` wipes it)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission;Username=admission;Password=admission"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      API_URL: "${API_URL:-http://localhost:8080}"
    depends_on:
      - backend

  # Test runners (only with `--profile test`, never started by plain `docker compose up`).
  # Sources are copied without bin/obj/node_modules so host build output never leaks in.
  backend-tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["test"]
    volumes:
      - ./backend:/src:ro
    environment:
      TEST_DB_CONNECTION: "Host=db;Port=5432;Database=admission_test;Username=admission;Password=admission"
    command: sh -c "mkdir -p /work && cd /src && tar cf - --exclude=bin --exclude=obj . | tar xf - -C /work && cd /work && dotnet test SchoolAdmission.Tests"
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    image: node:20-alpine
    profiles: ["test"]
    volumes:
      - ./frontend:/src:ro
    command: sh -c "mkdir -p /work && cd /src && tar cf - --exclude=node_modules --exclude=dist . | tar xf - -C /work && cd /work && npm ci && npm test"

volumes:
  pgdata:
